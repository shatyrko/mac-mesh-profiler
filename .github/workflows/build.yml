name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a release on tag pushes

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal app
    # Xcode 26 / macOS 26 SDK: apps built against an older SDK are drawn in the
    # pre-26 style on macOS 26. The binary still runs on macOS 14+.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            base=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
            echo "version=${base}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, sign (ad-hoc) and zip
        env:
          UNIVERSAL: "1"
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh --zip

      - name: Verify bundle
        run: |
          APP="build/Mac Mesh Profiler.app"
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/MacMeshProfiler"
          lipo "$APP/Contents/MacOS/MacMeshProfiler" -verify_arch arm64 x86_64
          # Guard against silently falling back to an older SDK.
          for arch in arm64 x86_64; do
            info=$(otool -arch "$arch" -l "$APP/Contents/MacOS/MacMeshProfiler" | grep -A4 LC_BUILD_VERSION)
            echo "$arch: $(echo "$info" | awk '/minos|sdk/ {printf "%s %s  ", $1, $2}')"
            sdk=$(echo "$info" | awk '/sdk/ {print $2}' | cut -d. -f1)
            if [ "$sdk" -lt 26 ]; then echo "::error::$arch built against SDK $sdk, expected 26+"; exit 1; fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacMeshProfiler-${{ steps.version.outputs.version }}-macOS
          path: |
            build/*.zip
            build/*.zip.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="build/MacMeshProfiler-${VERSION}-macOS.zip"
          SHA=$(cut -d' ' -f1 "${ZIP}.sha256")
          sed -e "s/{{VERSION}}/${VERSION}/g" -e "s/{{SHA256}}/${SHA}/g" \
            .github/release-notes.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" "$ZIP" "${ZIP}.sha256" \
            --title "Mac Mesh Profiler ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag
